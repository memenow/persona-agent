[project]
name = "persona-agent"
version = "0.2.0"
description = "Persona agents exposed over A2A v1.0 and a FastAPI REST API with MCP tool support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[fastapi,http-server]>=1.3.1",
    "openai>=3.60.0",
    "mcp>=2.3.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.4",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
]

[project.scripts]
persona-agent = "persona_agent.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ruff>=0.17.6",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_agent"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["persona_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
